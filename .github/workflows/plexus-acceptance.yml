# Plexus CI: formatting, vet, race tests, cross builds, hard size gate,
# fresh-clone build, dependency budget and a full-history secret scan.
name: plexus-acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go vet (GOOS=windows)
        run: GOOS=windows go vet ./...
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: direct-dependency budget
        run: go test ./tests/deps/ -run TestDirectDependencyBudget -count=1 -v
      - name: go test -race
        run: go test -race -p 1 ./...
        env:
          PLEXUS_INSECURE_DEV_SECRETS: '1'

  builds-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: build windows/amd64 (release) + 25 MiB gate
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o plexus-amd64.exe ./cmd/plexus
          size=$(stat -c%s plexus-amd64.exe)
          echo "windows/amd64 = $size bytes ($((size/1024/1024)) MiB)"
          if [ "$size" -gt $((25*1024*1024)) ]; then
            echo "FAIL: exceeds 25 MiB gate"; exit 1
          fi
      - name: build windows/arm64 (release)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w' -o plexus-arm64.exe ./cmd/plexus
          size=$(stat -c%s plexus-arm64.exe)
          echo "windows/arm64 = $size bytes ($((size/1024/1024)) MiB)"
          if [ "$size" -gt $((25*1024*1024)) ]; then
            echo "FAIL: exceeds 25 MiB gate"; exit 1
          fi

  fresh-clone-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      # A fresh clone must build: no gitignore pattern may hide a tracked
      # package (e.g. internal/secrets vs a stray secrets* rule).
      - name: fresh clone + build
        run: |
          tmp=$(mktemp -d)
          git clone --depth 1 "file://$PWD" "$tmp/plexus"
          cd "$tmp/plexus"
          test -f internal/secrets/secrets.go || { echo "internal/secrets missing from clone"; exit 1; }
          go build ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .github/workflows/gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # DSH bridge plugin: typecheck, tests, and a reproducible rebuild that
  # must be byte-identical to the committed artifact and its hash file
  # (Bun is pinned as an npm devDependency). Owned by the adapter engineer.
  dsh-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: DSH bridge reproducible rebuild
        working-directory: internal/adapters/dsh/bridge/plugin
        run: |
          npm ci
          npm run typecheck
          npm test
          node scripts/build.mjs --check

  # Wanted before the v0.1 tag; informational until then (never blocks).
  windows-test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: go vet (windows)
        run: go vet ./...
      - name: go test (windows)
        run: go test -p 1 ./...

  # Release benchmarks: run once per release (manual dispatch), not on
  # every push. Gates: in-memory routing >= 20k events/s, durable writes
  # >= 2,000/s. Record the numbers in docs/VERIFICATION.md.
  release-benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: in-memory event routing (>= 20k events/s)
        run: go test ./internal/slackbot/ -run '^$' -bench BenchmarkEventRouting -benchtime 1000000x -count 3
      - name: durable writes (>= 2,000/s)
        run: go test ./tests/perf/ -run '^$' -bench 'BenchmarkDurableDedupWrites|BenchmarkDedupThroughput' -benchtime 3s -count 3
